name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, cms]
  schedule:
    - cron: '0 5 * * *'   # 06:00 UK summer time: publishes scheduled posts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build preview (noindex, ad placeholders)
        run: node src/build.mjs
        env:
          BASE: /${{ github.event.repository.name }}/
      - name: Check links and SEO tags
        run: node src/check.mjs
        env:
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
