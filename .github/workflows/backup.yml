name: Backup content

# Zips everything an editor can change (content/ and public/img/) and attaches it
# to a GitHub Release tagged backup-YYYY-MM-DD. Runs every Sunday night and on
# demand from the Actions tab ("Run workflow"). The newest 12 backups are kept.
# Restore one with the "Restore content from a backup" workflow.

on:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Zip the content and images
        run: |
          STAMP="$(date -u +%Y-%m-%d)"
          FILE="paulcee-backup-$STAMP.zip"
          zip -qr "$FILE" content public/img
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "FILE=$FILE"   >> "$GITHUB_ENV"
          echo "TAG=backup-$STAMP" >> "$GITHUB_ENV"
          du -h "$FILE"

      - name: Attach it to a release tagged with today's date
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Content backup $STAMP" \
            --notes "Backup of content/ and public/img/ as of $STAMP (commit ${GITHUB_SHA:0:7}). Restore with the 'Restore content from a backup' workflow by entering the tag $TAG."

      - name: Keep only the newest 12 backups
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^backup-' | sort -r | tail -n +13 \
            | while read -r old; do
                echo "Deleting $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
